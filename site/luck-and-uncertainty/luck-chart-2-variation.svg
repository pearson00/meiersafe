<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 636" width="400" height="636" role="img" aria-labelledby="t d">
  <title id="t">Skill, judgment and unknowns determine safety level</title>
  <desc id="d">A Safety Level column shading from Poor (red) at the bottom through Caution (yellow) to Great (green) at the top. Skill runs up the left side from Less to More; Judgment runs up the right side from Worse to Better; Unknowns run across the top from Less on the left to More on the right. A line joins a high skill point on the left to a good judgment point on the right. A vertical line about two thirds of the way across shows the level of unknowns; where it crosses the skill-judgment line, near the top of the column, marks the resulting safety level. After Mike Meier's 2021 chart, itself after Art Tomassetti's chart in Flight Test Safety Fact, May 2021, as noted under the chart.</desc>
  <defs>
    <linearGradient id="safety" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9e44"/>
      <stop offset=".08" stop-color="#2e9e44"/>
      <stop offset=".24" stop-color="#9cc43a"/>
      <stop offset=".38" stop-color="#f5c01a"/>
      <stop offset=".64" stop-color="#f5c01a"/>
      <stop offset=".76" stop-color="#ee6a1f"/>
      <stop offset=".88" stop-color="#d7261e"/>
      <stop offset="1" stop-color="#d7261e"/>
    </linearGradient>
    <path id="star" d="M0.0 -8.5L2.1 -2.9L8.1 -2.6L3.4 1.1L5.0 6.9L0.0 3.6L-5.0 6.9L-3.4 1.1L-8.1 -2.6L-2.1 -2.9Z" fill="#14202b" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
  </defs>
  <rect width="400" height="636" fill="#ffffff"/>

  <!-- Safety Level column -->
  <rect x="109" y="59" width="191" height="500" rx="3" fill="url(#safety)"/>

  <g font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#14202b">
    <g font-size="20" font-weight="500" text-anchor="middle">
      <text x="204" y="31">&lt;Unknowns&gt;</text>
      <text x="204" y="584">Safety Level</text>
      <text transform="translate(93 312) rotate(-90)">&lt;Skill&gt;</text>
      <text transform="translate(318 312) rotate(90)">&lt;Judgment&gt;</text>
    </g>
    <g font-size="13">
      <g text-anchor="end">
        <text x="97" y="32">Less</text>
        <text x="97" y="105">More</text>
        <text x="97" y="553">Less</text>
      </g>
      <text x="304" y="32">More</text>
      <text x="304" y="105">Better</text>
      <text x="304" y="553">Worse</text>
    </g>
    <text x="200" y="622" font-size="12.5" fill="#55626f" text-anchor="middle">After Art Tomassetti – Flight Test Safety Fact – May 2021</text>
    <g font-size="19" font-weight="600" font-style="italic" text-anchor="middle">
      <text x="202" y="83">Great</text>
      <text x="193" y="302">Caution</text>
      <text x="209" y="535">Poor</text>
    </g>
  </g>

  <!-- Unknowns: one vertical line -->
  <line x1="235" y1="57" x2="235" y2="559" stroke="#1f5fbf" stroke-width="3.5"/>

  <!-- Skill point to judgment point -->
  <line x1="109" y1="79" x2="300" y2="153" stroke="#14202b" stroke-width="3.5" stroke-linecap="round"/>
  <use href="#star" x="109" y="79"/>
  <use href="#star" x="300" y="153"/>
  <circle cx="235" cy="127.8" r="7" fill="#1f5fbf" stroke="#ffffff" stroke-width="1.5"/>
</svg>
