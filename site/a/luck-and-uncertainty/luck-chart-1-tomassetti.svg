<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" width="640" height="510" role="img" aria-labelledby="t d">
  <title id="t">Skill and luck determine performance</title>
  <desc id="d">Skill on a left-hand scale from 0 to 100 and luck on a right-hand scale from 0 to 100. Between them stands a Performance Level column shading from Bad (red) at the bottom through OK (orange and yellow) and Good (yellow-green) to Great (green) at the top. A dashed line runs from a high skill point near the top of the left scale down to a low luck point on the right scale, crossing the column's centre line in the Good region, which marks the resulting performance. After Art Tomassetti's chart in Flight Test Safety Fact, May 2021.</desc>
  <defs>
    <linearGradient id="perf" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9e44"/>
      <stop offset=".12" stop-color="#2e9e44"/>
      <stop offset=".36" stop-color="#9cc43a"/>
      <stop offset=".58" stop-color="#f5c01a"/>
      <stop offset=".72" stop-color="#ee6a1f"/>
      <stop offset=".86" stop-color="#d7261e"/>
      <stop offset="1" stop-color="#d7261e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55626f"/></marker>
    <path id="x" d="M-11 -11L11 11M11 -11L-11 11" fill="none" stroke="#14202b" stroke-width="5" stroke-linecap="round"/>
  </defs>
  <rect width="640" height="510" fill="#ffffff"/>

  <!-- Performance Level column -->
  <rect x="245" y="34" width="110" height="390" rx="3" fill="url(#perf)"/>
  <line x1="300" y1="34" x2="300" y2="428" stroke="#14202b" stroke-width="1.5"/>

  <!-- Skill axis (left) and luck axis (right) -->
  <line x1="53" y1="392" x2="53" y2="56" stroke="#55626f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="566" y1="410" x2="566" y2="72" stroke="#55626f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g font-size="16" fill="#14202b" text-anchor="middle">
      <text x="53" y="44">100</text>
      <text x="58" y="412">0</text>
      <text x="566" y="60">100</text>
      <text x="569" y="430">0</text>
      <text x="300" y="447">Performance</text>
      <text x="300" y="470">Level</text>
    </g>
    <rect x="18" y="196" width="70" height="28" fill="#ffffff"/>
    <rect x="530" y="222" width="72" height="28" fill="#ffffff"/>
    <g font-size="16" font-weight="500" fill="#14202b" text-anchor="middle" letter-spacing=".04em">
      <text x="53" y="216">SKILL</text>
      <text x="566" y="242">LUCK</text>
    </g>
    <g font-size="23" font-weight="600" fill="#14202b" text-anchor="middle">
      <text x="300" y="66">Great</text>
      <text x="300" y="178">Good</text>
      <text x="300" y="292">OK</text>
      <text x="300" y="366">Bad</text>
    </g>
  </g>

  <!-- Skill point, luck point, and the dashed line joining them -->
  <line x1="100" y1="89" x2="524" y2="319" stroke="#14202b" stroke-width="3" stroke-dasharray="12 8"/>
  <use href="#x" x="100" y="89"/>
  <use href="#x" x="524" y="319"/>
  <use href="#x" x="300" y="197"/>
</svg>
